<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW 11/12 - Mythology Trivia</title>

  <!-- Link to your stylesheet inside css/ -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Link to your Mythology trivia script inside js/ -->
  <script src="js/apiapp.js" defer></script>
</head>
<body>

  <!-- Navigation back to index.html -->
  <nav>
    <a href="index.html">&larr; Back to Home</a>
  </nav>

  <!-- Page Header -->
  <header class="site-header">
    <h1>How well do you know your Mythology?</h1>
    <p class="subtitle">Who doesn't love Mythology and Trivia?</p>
  </header>

  <main>

    <!-- Container where Mythology question cards are injected -->
    <div id="api-output" aria-live="polite">
      <div class="card"><p>Loading questions...</p></div>
    </div>

    <!-- Live Scoreboard Card -->
    <section class="card scoreboard" aria-live="polite">
      <div class="score-stats">
        <span class="score-pill right">Right: <strong id="right-count">0</strong></span>
        <span class="score-pill wrong">Wrong: <strong id="wrong-count">0</strong></span>
        <span class="score-pill total">Answered: <strong id="answered-count">0</strong> / 10</span>
      </div>
      <button id="reload-btn" class="button" type="button">Load New Questions</button>
    </section>

    <p>Used the Open Trivia API to source the questions from! -Ash</p>

      </main>

  <footer class="site-footer">
    <p>
      Built for <strong>Data Visualization Design</strong> &middot;
      Hosted free on GitHub Pages
    </p>
  </footer>

</body>
</html>
