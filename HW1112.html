<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Document metadata and responsive viewport setup -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW 11/12 - Mythology Trivia</title>

  <!-- Link to your exact stylesheet filename: style.css -->
  <link rel="stylesheet" href="style.css">

  <!-- Load JavaScript after HTML finishes parsing -->
  <script src="apiapp.js" defer></script>
</head>
<body>

  <!-- Navigation back to the main index page -->
  <nav>
    <a href="index.html">&larr; Back to Home</a>
  </nav>

  <!-- Page header -->
  <header class="site-header">
    <h1>How much Mythology do you know?</h1>
    <p class="subtitle">Click an answer on each card to test your knowledge.</p>
  </header>

  <main>
    <!-- Live Scoreboard Card -->
    <section class="card scoreboard" aria-live="polite">
      <div class="score-stats">
        <span class="score-pill right">Right: <strong id="right-count">0</strong></span>
        <span class="score-pill wrong">Wrong: <strong id="wrong-count">0</strong></span>
        <span class="score-pill total">Answered: <strong id="answered-count">0</strong> / 10</span>
      </div>
      <button id="reload-btn" class="button" type="button">Load New Questions</button>
    </section>

    <!-- Container where question cards are injected -->
    <div id="api-output" aria-live="polite">
      <p>Loading trivia questions...</p>
      <p class="subtitle">Questions gotten from Open Trivia DB using their API
        generator - Ashlena.</p>
    </div>
  </main>

</body>
</html>
